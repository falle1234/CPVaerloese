version: "3.8"

networks:
  proxy:
    external: true

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__DOMAIN=${FORGEJO_DOMAIN:-git.local}
      - FORGEJO__server__SSH_DOMAIN=${FORGEJO_DOMAIN:-git.local}
      - FORGEJO__server__ROOT_URL=https://${FORGEJO_DOMAIN:-git.local}/
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_LISTEN_PORT=22
      - FORGEJO__server__SSH_PORT=${FORGEJO_SSH_PORT:-2222}
      - TZ=${TZ:-Europe/Copenhagen}
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGEJO_SSH_PORT:-2222}:22"
    networks:
      - proxy
